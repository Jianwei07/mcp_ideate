[project]
name = "secure-mcp-research"
version = "0.1.0"
description = "Localhost MCP sampling, logging, roots, and secure Notion research POC"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "mcp[cli]==1.27.2",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[project.scripts]
secure-research = "secure_research.web:main"
secure-research-server = "secure_research.server:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["secure_research*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
